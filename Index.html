<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Browsing Page</title>
    <link rel="stylesheet" href="./CSS/Style.css" type="text/css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div>
      <nav class="navbar">
        <div class="container-fluid">
          <a class="navbar-brand" href="#"
            ><img
              src="./Images/Netflix-Logo.png"
              class="netflix-logo"
              alt="netflix-logo"
          /></a>
        </div>
      </nav>
    </div>
    <div class="mainDiv">
      <h1 class="divHeading">Who's Watching?</h1>
      <div class="container subDiv">
        <div class="row">
          <div class="col-lg-4 col-md-4 col-sm-4 image-div">
            <img
              src="./Images/profile_1.png"
              class="profile-image"
              alt="profile-image-1"
            />

            <h6 class="profile-name">John</h6>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 image-div">
            <img
              src="./Images/profile_2.png"
              class="profile-image"
              alt="profile-image-2"
            />
            <h6 class="profile-name">Chris</h6>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 image-div">
            <div class="add-button-div">
              <img
                src="./Images/add_button.png"
                class="add-button-image"
                alt="add-button-image"
              />
            </div>
            <h6 class="add-button">Add Profile</h6>
          </div>
        </div>
      </div>
      <div class="manage-button-div">
        <button type="button" class="btn btn-outline-secondary manage-profile">
          Manage Profiles
        </button>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
      integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
      integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
